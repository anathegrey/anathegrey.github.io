<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ana Jorge Almeida</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Text-based navigation links -->
  <div id="menuLinks">
    <span id="infoLink">info</span>
    <span id="publicationsLink">research</span>
    <span id="teachingLink">teaching</span>
  </div>

  <!-- Info Window -->
  <div id="infoWindow" class="folder-window draggable" style="display: none;">
    <div id="infoHeader">
      <span id="infoTitle">info</span>
      <button id="infoCloseFolder">X</button>
    </div>
    <div id="infoContent">
      <!-- Content loaded from info.html -->
    </div>
   </div>

  <!-- Publications Window -->
  <div id="pubWindow" class="folder-window draggable" style="display: none;">
    <div id="pubHeader">
      <span id="pubTitle">research</span>
      <button id="pubCloseFolder">X</button>
    </div>
    <div id="pubContent">
      <!-- Content loaded from publications.html -->
    </div>
  </div>
  
   <!-- Teaching Window -->
  <div id="teachWindow" class="folder-window draggable" style="display: none;">
    <div id="teachHeader">
      <span id="teachTitle">teaching</span>
      <button id="teachCloseFolder">X</button>
    </div>
    <div id="teachContent">
      <!-- Content loaded from teaching.html -->
    </div>
  </div>

  <!-- 25 de abril icon -->
  <div id="25abrilicon" class="draggable-icon">
    <img src="Icons/25_de_abril.png" alt="25abril"/>
  </div>

  <!-- Toolbar -->
  <div id="toolbar">
    <a href="https://orcid.org/0009-0007-7860-7311" target="_blank" class="toolbarIcon">
      <img src="Icons/orcid-icon.png" alt="ORCID" />
    </a>
    <a href="https://github.com/anathegrey" target="_blank" class="toolbarIcon">
      <img src="Icons/github-icon.png" alt="GitHub" />
    </a>
    <a href="https://www.linkedin.com/in/ana-jorge-almeida/" target="_blank" class="toolbarIcon">
      <img src="Icons/linkedin.png" alt="LinkedIn" />
    </a>
    <a href="https://app.thestorygraph.com/profile/anathegrey" target="_blank" class="toolbarIcon">
      <img src="Icons/storygraph.png" alt="Storygraph" />
    </a>
  </div>

  <div id="animationContainer">
    <canvas id="backgroundCanvas"></canvas>
    <div id="nameText" data-name="Ana Jorge Almeida">Ana Jorge Almeida</div>
    <div id="contactInfo">
      <p>anaj.almeida [at] fc.up.pt</p>
      <p>PhD student, Universidade do Porto</p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="script.js" defer></script>
</body>
</html>
